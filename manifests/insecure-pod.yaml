apiVersion: v1
kind: Pod
metadata:
  name: insecure-app
  labels:
    app: insecure-app
spec:
  containers:
  - name: app-container
    image: nginx:latest
    ports:
    - containerPort: 80
    securityContext:
      privileged: true
      runAsUser: 0
    env:
    - name: SECRET_KEY
      value: "hardcoded-secret-123"
    resources: {}
